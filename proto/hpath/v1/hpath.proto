// HPath gRPC contract, version v1.
//
// This file is the single coupling point between the desktop client (Tauri,
// Rust tonic) and the server (Node, @grpc/grpc-js). It is finalized up front
// (SPEC 1.0 / T1); mock and real server implementations both serve this exact
// contract.
//
// Conventions:
// - Timestamps are ISO-8601 strings (spike-level simplicity; no well-known
//   Timestamp type to avoid long/date friction across languages).
// - Scalar sizes/costs are int32 (sufficient for spike artifact sizes).
// - Storage keys follow `artifacts/{project}/{env}/{run}/...`.
// - Comments are in English (architecture invariant).

syntax = "proto3";

package hpath.v1;

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Who created an entity (a case, primarily).
enum CreatorType {
  CREATOR_TYPE_UNSPECIFIED = 0;
  CREATOR_TYPE_HUMAN = 1;
  CREATOR_TYPE_AGENT = 2;
}

// Review workflow status of a case. Only APPROVED cases can run.
enum CaseStatus {
  CASE_STATUS_UNSPECIFIED = 0;
  CASE_STATUS_DRAFT = 1;
  CASE_STATUS_PENDING = 2;
  CASE_STATUS_APPROVED = 3;
  CASE_STATUS_DISABLED = 4;
}

// Lifecycle status of a run.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_PASSED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELLED = 5;
}

// What triggered a run.
enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  RUN_TRIGGER_MANUAL = 1;
  RUN_TRIGGER_AGENT = 2;
}

// Supported PRD input formats.
enum PrdFormat {
  PRD_FORMAT_UNSPECIFIED = 0;
  PRD_FORMAT_MD = 1;
  PRD_FORMAT_DOCX = 2;
  PRD_FORMAT_PDF = 3;
}

// Kind of binary evidence attached to a run.
enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_VIDEO = 1;
  ARTIFACT_KIND_TRACE = 2;
  ARTIFACT_KIND_SCREENSHOT = 3;
  ARTIFACT_KIND_REQUEST_LOG = 4;
  ARTIFACT_KIND_TRANSCRIPT = 5;
}

// Review actions applied to a case.
enum ReviewAction {
  REVIEW_ACTION_UNSPECIFIED = 0;
  REVIEW_ACTION_APPROVE = 1; // PENDING/DRAFT/DISABLED -> APPROVED
  REVIEW_ACTION_REJECT = 2;  // PENDING -> DRAFT
  REVIEW_ACTION_DISABLE = 3; // APPROVED -> DISABLED
}

// Overall verdict of a run's three-way alignment check.
enum VerdictStatus {
  VERDICT_STATUS_UNSPECIFIED = 0;
  VERDICT_STATUS_PASSED = 1;
  VERDICT_STATUS_FAILED = 2;
  VERDICT_STATUS_INCONCLUSIVE = 3;
}

// ---------------------------------------------------------------------------
// Core entities
// ---------------------------------------------------------------------------

// Creator of an entity. Humans are recorded by name; agent-created entities
// reference the analyze run that produced them.
message Creator {
  CreatorType type = 1;
  string name = 2;    // human display name, or "analyze-run#<id>" for agents
  string run_ref = 3; // analyze run id when type == CREATOR_TYPE_AGENT
}

// Top-level grouping. Holds envs, cases, PRDs, runs.
message Project {
  string id = 1;
  string name = 2;
  string repo_url = 3;    // SUT repo address, metadata only in 1.0
  string created_at = 4;  // ISO-8601
}

// A named target of a project (dev / staging / ...).
message Env {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string web_base_url = 4;
  string grpc_address = 5;
  map<string, string> vars = 6;        // free-form variables injected into agent context
  map<string, string> credentials = 7; // plaintext in 1.0 spike
  // Project-scoped default env: at most one per project (enforced by a
  // partial unique index in SQLite). The first env of a project becomes the
  // default automatically; deleting the default promotes the next env.
  bool is_default = 8;
}

// One three-way alignment declaration of a case.
message Alignment {
  string api_path = 1;  // relative API path, resolved against the current env
  string ui_anchor = 2; // UI element the agent must observe
  string rule = 3;      // alignment rule in plain language
}

// One version-history entry of a case.
message ChangeLogEntry {
  int32 version = 1;
  string author = 2;
  string comment = 3;
  string changed_at = 4; // ISO-8601
}

// A test case definition. This is a *definition*, not a step script: the
// executor agent decides how to reach the goal autonomously.
message Case {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string goal = 4;
  repeated Alignment alignments = 5;
  Creator creator = 6;
  CaseStatus status = 7;
  string source_prd_ref = 8; // traceability to PRD section, empty for manual cases
  int32 version = 9;
  repeated ChangeLogEntry changelog = 10;
  string created_at = 11; // ISO-8601
  string updated_at = 12; // ISO-8601
}

// Evidence for one alignment entry: what the API returned vs what the UI showed.
message AlignmentEvidence {
  string api_path = 1;
  string ui_anchor = 2;
  string rule = 3;
  string api_observed = 4;
  string ui_observed = 5;
  bool match = 6;
  string notes = 7;
}

// Structured three-way alignment verdict of a run.
message Verdict {
  VerdictStatus status = 1;
  string summary = 2;
  repeated AlignmentEvidence evidence = 3;
}

// One execution of a case against one env.
message Run {
  string id = 1;
  string project_id = 2;
  string env_id = 3;
  string case_id = 4;
  RunStatus status = 5;
  RunTrigger trigger = 6;
  Verdict verdict = 7;     // set when terminal
  string started_at = 8;   // ISO-8601
  string finished_at = 9;  // ISO-8601, empty while running
  int32 duration_ms = 10;
  int32 token_cost = 11;
  string fail_reason = 12; // e.g. "limit:max_steps", empty when passed
}

// Recorded interaction evidence, e.g. one HTTP/gRPC exchange.
message RequestRecord {
  string direction = 1;   // e.g. "http" | "grpc"
  string method = 2;      // GET/POST or full method path for gRPC
  string target = 3;      // resolved URL / gRPC address+method
  string request_json = 4;
  string response_json = 5;
}

message AgentText {
  string text = 1;
}

message ToolStarted {
  string tool = 1;      // tool name, e.g. "navigate", "http_request"
  string args_json = 2; // JSON-serialized arguments
}

message ToolFinished {
  string tool = 1;
  bool ok = 2;
  string result_summary = 3;
  string artifact_id = 4; // optional artifact produced by the tool
}

message Screenshot {
  string artifact_id = 1;
  string caption = 2;
}

message ErrorInfo {
  string kind = 1;    // e.g. "limit:max_steps", "tool_error"
  string message = 2;
}

message RunStatusChanged {
  RunStatus status = 1;
  string reason = 2; // e.g. fail reason
}

// A single streamed event of a run (executor or analyze agent).
message Event {
  string run_id = 1;
  int32 seq = 2;
  string timestamp = 3; // ISO-8601
  oneof payload {
    AgentText agent_text = 4;
    AgentText agent_thinking = 5;
    ToolStarted tool_started = 6;
    ToolFinished tool_finished = 7;
    Screenshot screenshot = 8;
    RequestRecord request_record = 9;
    Verdict verdict = 10;
    ErrorInfo error = 11;
    RunStatusChanged run_status = 12;
  }
}

// Binary evidence stored in SeaweedFS (real impl) or memory (mock).
message Artifact {
  string id = 1;
  string run_id = 2;
  ArtifactKind kind = 3;
  string key = 4;         // artifacts/{project}/{env}/{run}/...
  int32 size_bytes = 5;
  string sha256 = 6;      // hex digest
  string created_at = 7;  // ISO-8601
}

// An uploaded PRD document.
message Prd {
  string id = 1;
  string project_id = 2;
  string filename = 3;
  PrdFormat format = 4;
  int32 size_bytes = 5;
  string created_at = 6;  // ISO-8601
  string content_ref = 7; // storage key, empty when content stays in memory (mock)
}

// ---------------------------------------------------------------------------
// Requests / responses
// ---------------------------------------------------------------------------

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateProjectRequest {
  string name = 1;
  string repo_url = 2; // optional metadata
}

message ListEnvsRequest {
  string project_id = 1;
}

message ListEnvsResponse {
  repeated Env envs = 1;
}

// Create (when env.id is empty) or update an env.
message UpsertEnvRequest {
  Env env = 1;
}

message DeleteEnvRequest {
  string env_id = 1;
}

// PRD upload + analyze trigger. The whole file is sent in one field (spike
// files are small). Response streams analyze-agent progress and ends with the
// created draft cases.
message ParsePRDRequest {
  string project_id = 1;
  string filename = 2;
  PrdFormat format = 3;
  bytes content = 4;
}

message Progress {
  int32 pct = 1;
  string message = 2;
}

message DraftsCreated {
  repeated string case_ids = 1;
  repeated Case cases = 2;
}

message PrdRegistered {
  Prd prd = 1;
}

message ParseEvent {
  oneof payload {
    PrdRegistered prd_registered = 1;
    AgentText thinking = 2;
    Progress progress = 3;
    DraftsCreated drafts_created = 4;
    ErrorInfo error = 5;
  }
}

message ListCasesRequest {
  string project_id = 1;
  CaseStatus status = 2; // UNSPECIFIED = all statuses
}

message ListCasesResponse {
  repeated Case cases = 1;
}

message GetCaseRequest {
  string case_id = 1;
}

message ReviewCaseRequest {
  string case_id = 1;
  ReviewAction action = 2;
  string comment = 3;
}

message RunCaseRequest {
  string project_id = 1;
  string env_id = 2;
  string case_id = 3;
  RunTrigger trigger = 4;
}

message ListRunsRequest {
  string project_id = 1;
  string env_id = 2;    // optional filter, empty = all envs
  string case_id = 3;   // optional filter
  RunStatus status = 4; // optional filter, UNSPECIFIED = all
  string from = 5;      // optional ISO-8601 lower bound on started_at
  string to = 6;        // optional ISO-8601 upper bound on started_at
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  string run_id = 1;
}

// Full run payload for the replay view.
message RunDetail {
  Run run = 1;
  repeated Event events = 2;
  repeated Artifact artifacts = 3;
}

message DownloadArtifactRequest {
  string artifact_id = 1;
}

// Chunk of binary artifact data.
message BytesChunk {
  bytes data = 1;
}

// ---------------------------------------------------------------------------
// Settings & chat
// ---------------------------------------------------------------------------

// Application-level settings. The provider configuration travels as an opaque
// JSON document (opencode-style provider descriptors: baseUrl / apiKey /
// models with a multimodal flag); the server validates the shape and that the
// default model is multimodal-capable.
message AppSettings {
  string provider_config_json = 1;
  string default_model = 2; // must reference a multimodal model in the config
}

message ChatRequest {
  string message = 1; // free-text user question
}

// Emitted once when the chat stream starts: resolved model id plus a rough
// client-visible estimate of the upward prompt size (snapshot + question).
message ChatStatus {
  string model = 1;
  uint64 prompt_tokens_est = 2;
}

// Emitted once when the chat stream finishes successfully: exact token usage
// as reported by the provider runtime (pi-ai done event).
message ChatUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  double cost_total = 3; // USD; 0 when the provider reports no pricing
}

// Streamed chat answer: text deltas, a terminal error, and the start/finish
// bookkeeping events (status/usage) that let clients show live metrics.
message ChatResponse {
  oneof kind {
    string text_delta = 1;
    string error = 2;
    ChatStatus status = 3;
    ChatUsage usage = 4;
  }
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

// Local empty message. Deliberately not google.protobuf.Empty: proto-loader's
// reflection pipeline strips cross-file dependencies, which breaks grpcurl
// against services importing well-known types. A local message keeps the
// contract self-contained.
message Empty {}


service Hpath {
  rpc ListProjects(Empty) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc ListEnvs(ListEnvsRequest) returns (ListEnvsResponse);
  rpc UpsertEnv(UpsertEnvRequest) returns (Env);
  // Fails with ALREADY_EXISTS when runs reference the env.
  rpc DeleteEnv(DeleteEnvRequest) returns (Empty);

  // Upload a PRD and run the analyze agent. Streams progress; the created
  // pending drafts become visible via ListCases.
  rpc ParsePRD(ParsePRDRequest) returns (stream ParseEvent);

  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  rpc GetCase(GetCaseRequest) returns (Case);
  // Applies a review transition; invalid transitions fail with
  // FAILED_PRECONDITION.
  rpc ReviewCase(ReviewCaseRequest) returns (Case);

  // Execute an approved case against an env. Streams run events in order.
  // Requires CASE_STATUS_APPROVED, else FAILED_PRECONDITION.
  rpc RunCase(RunCaseRequest) returns (stream Event);

  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (RunDetail);
  // Streams artifact bytes in chunks (mock serves synthetic bytes; real impl
  // proxies SeaweedFS).
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream BytesChunk);

  // Model provider settings (JSON document + default multimodal model).
  // UpdateSettings validates the JSON shape and rejects non-multimodal
  // defaults with INVALID_ARGUMENT.
  rpc GetSettings(Empty) returns (AppSettings);
  rpc UpdateSettings(AppSettings) returns (AppSettings);

  // Free-text status chat answered by the configured LLM (system prompt +
  // system data snapshot). Streams text deltas; errors surface on the error
  // branch of ChatResponse.
  rpc Chat(ChatRequest) returns (stream ChatResponse);
}
