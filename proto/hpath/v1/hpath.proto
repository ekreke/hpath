// HPath gRPC contract, version v1.
//
// This file is the single coupling point between the desktop client (Tauri,
// Rust tonic) and the server (Node, @grpc/grpc-js). It is finalized up front
// (SPEC 1.0 / T1); mock and real server implementations both serve this exact
// contract.
//
// Conventions:
// - Timestamps are ISO-8601 strings (spike-level simplicity; no well-known
//   Timestamp type to avoid long/date friction across languages).
// - Scalar sizes/costs are int32 (sufficient for spike artifact sizes).
// - Storage keys follow `artifacts/{project}/{env}/{run}/...`.
// - Comments are in English (architecture invariant).

syntax = "proto3";

package hpath.v1;

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Who created an entity (a case, primarily).
enum CreatorType {
  CREATOR_TYPE_UNSPECIFIED = 0;
  CREATOR_TYPE_HUMAN = 1;
  CREATOR_TYPE_AGENT = 2;
}

// Review workflow status of a case. Only APPROVED cases can run.
enum CaseStatus {
  CASE_STATUS_UNSPECIFIED = 0;
  CASE_STATUS_DRAFT = 1;
  CASE_STATUS_PENDING = 2;
  CASE_STATUS_APPROVED = 3;
  CASE_STATUS_DISABLED = 4;
}

// Lifecycle status of a run.
//
// Legal transitions (the run state machine, enforced server-side):
//
//   PENDING --> RUNNING <--> PAUSED
//                |  \           |
//                |   \          |
//                v    v         v
//             PASSED FAILED  CANCELLED
//
//   PENDING:  the run row exists, the agent has not started yet.
//   RUNNING:  the agent is executing (entering and leaving PAUSED).
//   PAUSED:   execution is suspended at a turn boundary (resumable).
//   PASSED / FAILED / CANCELLED: terminal.
//
// CANCELLED may be requested from PENDING, RUNNING or PAUSED.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_PASSED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELLED = 5;
  RUN_STATUS_PAUSED = 6;
}

// What triggered a run.
enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  RUN_TRIGGER_MANUAL = 1;
  RUN_TRIGGER_AGENT = 2;
}

// Supported PRD input formats.
enum PrdFormat {
  PRD_FORMAT_UNSPECIFIED = 0;
  PRD_FORMAT_MD = 1;
  PRD_FORMAT_DOCX = 2;
  PRD_FORMAT_PDF = 3;
}

// Kind of a project asset (T22 asset library). PRD assets ride the ParsePRD
// analyze flow; proto assets are parsed into the project's API surface that
// its agents can read and that hard-validates grpc_call.
enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  ASSET_TYPE_PRD = 1;
  ASSET_TYPE_PROTO = 2;
}

// Kind of binary evidence attached to a run.
enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_VIDEO = 1;
  ARTIFACT_KIND_TRACE = 2;
  ARTIFACT_KIND_SCREENSHOT = 3;
  ARTIFACT_KIND_REQUEST_LOG = 4;
  ARTIFACT_KIND_TRANSCRIPT = 5;
}

// Review actions applied to a case.
enum ReviewAction {
  REVIEW_ACTION_UNSPECIFIED = 0;
  REVIEW_ACTION_APPROVE = 1; // PENDING/DRAFT/DISABLED -> APPROVED
  REVIEW_ACTION_REJECT = 2;  // PENDING -> DRAFT
  REVIEW_ACTION_DISABLE = 3; // APPROVED -> DISABLED
}

// Overall verdict of a run's three-way alignment check.
enum VerdictStatus {
  VERDICT_STATUS_UNSPECIFIED = 0;
  VERDICT_STATUS_PASSED = 1;
  VERDICT_STATUS_FAILED = 2;
  VERDICT_STATUS_INCONCLUSIVE = 3;
}

// ---------------------------------------------------------------------------
// Core entities
// ---------------------------------------------------------------------------

// Creator of an entity. Humans are recorded by name; agent-created entities
// reference the analyze run that produced them.
message Creator {
  CreatorType type = 1;
  string name = 2;    // human display name, or "analyze-run#<id>" for agents
  string run_ref = 3; // analyze run id when type == CREATOR_TYPE_AGENT
}

// Top-level grouping. Holds envs, cases, PRDs, runs.
message Project {
  string id = 1;
  string name = 2;
  string repo_url = 3;    // SUT repo address, metadata only in 1.0
  string created_at = 4;  // ISO-8601
}

// Per-env overrides for the agent kernel's hard limits. A value of 0 means
// "not set" — the run falls back to the executing AgentDefinition's default
// (e.g. execute-agent: 32 steps / 400k tokens / 5 min).
message AgentLimits {
  int32 max_steps = 1;    // maximum LLM turns per run
  int32 token_budget = 2; // cumulative input+output token cap
  int32 timeout_min = 3;  // wall-clock cap for the whole run, in minutes
}

// A named target of a project (dev / staging / ...).
message Env {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string web_base_url = 4;
  string grpc_address = 5;
  map<string, string> vars = 6;        // free-form variables injected into agent context
  map<string, string> credentials = 7; // plaintext in 1.0 spike
  // Project-scoped default env: at most one per project (enforced by a
  // partial unique index in SQLite). The first env of a project becomes the
  // default automatically; deleting the default promotes the next env.
  bool is_default = 8;
  // Optional agent hard-limit overrides; 0 values fall back to agent defaults.
  AgentLimits agent_limits = 9;
}

// Run lifecycle control. The server enforces the state machine:
// PauseRun RUNNING -> PAUSED, ResumeRun PAUSED -> RUNNING, CancelRun
// PENDING/RUNNING/PAUSED -> CANCELLED (terminal). Invalid transitions fail
// with FAILED_PRECONDITION, unknown run ids with NOT_FOUND.
message RunControlRequest {
  string run_id = 1;
}

// One three-way alignment declaration of a case.
message Alignment {
  string api_path = 1;  // relative API path, resolved against the current env
  string ui_anchor = 2; // UI element the agent must observe
  string rule = 3;      // alignment rule in plain language
}

// One version-history entry of a case.
message ChangeLogEntry {
  int32 version = 1;
  string author = 2;
  string comment = 3;
  string changed_at = 4; // ISO-8601
}

// A test case definition. This is a *definition*, not a step script: the
// executor agent decides how to reach the goal autonomously.
message Case {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string goal = 4;
  repeated Alignment alignments = 5;
  Creator creator = 6;
  CaseStatus status = 7;
  string source_prd_ref = 8; // traceability to PRD section, empty for manual cases
  int32 version = 9;
  repeated ChangeLogEntry changelog = 10;
  string created_at = 11; // ISO-8601
  string updated_at = 12; // ISO-8601
}

// Evidence for one alignment entry: what the API returned vs what the UI showed.
message AlignmentEvidence {
  string api_path = 1;
  string ui_anchor = 2;
  string rule = 3;
  string api_observed = 4;
  string ui_observed = 5;
  bool match = 6;
  string notes = 7;
}

// Structured three-way alignment verdict of a run.
message Verdict {
  VerdictStatus status = 1;
  string summary = 2;
  repeated AlignmentEvidence evidence = 3;
}

// One execution of a case against one env.
message Run {
  string id = 1;
  string project_id = 2;
  string env_id = 3;
  string case_id = 4;
  RunStatus status = 5;
  RunTrigger trigger = 6;
  Verdict verdict = 7;     // set when terminal
  string started_at = 8;   // ISO-8601
  string finished_at = 9;  // ISO-8601, empty while running
  int32 duration_ms = 10;
  int32 token_cost = 11;
  string fail_reason = 12; // e.g. "limit:max_steps", empty when passed
}

// Recorded interaction evidence, e.g. one HTTP/gRPC exchange.
message RequestRecord {
  string direction = 1;   // e.g. "http" | "grpc"
  string method = 2;      // GET/POST or full method path for gRPC
  string target = 3;      // resolved URL / gRPC address+method
  string request_json = 4;
  string response_json = 5;
}

message AgentText {
  string text = 1;
}

message ToolStarted {
  string tool = 1;      // tool name, e.g. "navigate", "http_request"
  string args_json = 2; // JSON-serialized arguments
}

message ToolFinished {
  string tool = 1;
  bool ok = 2;
  string result_summary = 3;
  string artifact_id = 4; // optional artifact produced by the tool
}

message Screenshot {
  string artifact_id = 1;
  string caption = 2;
}

message ErrorInfo {
  string kind = 1;    // e.g. "limit:max_steps", "tool_error"
  string message = 2;
}

message RunStatusChanged {
  RunStatus status = 1;
  string reason = 2; // e.g. fail reason
}

// A single streamed event of a run (executor or analyze agent).
message Event {
  string run_id = 1;
  int32 seq = 2;
  string timestamp = 3; // ISO-8601
  oneof payload {
    AgentText agent_text = 4;
    AgentText agent_thinking = 5;
    ToolStarted tool_started = 6;
    ToolFinished tool_finished = 7;
    Screenshot screenshot = 8;
    RequestRecord request_record = 9;
    Verdict verdict = 10;
    ErrorInfo error = 11;
    RunStatusChanged run_status = 12;
  }
}

// Ephemeral live-view frame streamed by WatchRun (T21). Frames are never
// persisted as run evidence: the events table and GetRun replay stay
// frame-free. Only the newest frame matters to observers; intermediate
// frames may be dropped under backpressure.
message RunFrame {
  string run_id = 1;
  int64 seq = 2;
  string mime = 3;        // always "image/jpeg"
  bytes data = 4;         // encoded frame body
  int64 timestamp_ms = 5; // unix millis (server clock)
}

// Request a live frame stream for one run.
message WatchRunRequest {
  string run_id = 1;
}

// Binary evidence stored in SeaweedFS (real impl) or memory (mock).
message Artifact {
  string id = 1;
  string run_id = 2;
  ArtifactKind kind = 3;
  string key = 4;         // artifacts/{project}/{env}/{run}/...
  int32 size_bytes = 5;
  string sha256 = 6;      // hex digest
  string created_at = 7;  // ISO-8601
}

// An uploaded PRD document.
message Prd {
  string id = 1;
  string project_id = 2;
  string filename = 3;
  PrdFormat format = 4;
  int32 size_bytes = 5;
  string created_at = 6;  // ISO-8601
  string content_ref = 7; // storage key, empty when content stays in memory (mock)
}

// A project asset (T22 asset library). One asset = one upload: a PRD document
// (single file) or a proto bundle (one or more .proto files parsed into the
// project's API surface).
message Asset {
  string id = 1;
  string project_id = 2;
  AssetType type = 3;
  string filename = 4;    // display name: the PRD file or the proto entry file
  int32 size_bytes = 5;   // total bytes of all files in the upload
  string created_at = 6;  // ISO-8601
  string content_ref = 7; // storage key prefix of the stored bytes ("" in mock)
  // API surface of a proto asset: pre-rendered markdown document
  // (services / methods / message fields), empty for PRD assets.
  string api_doc = 8;
  int32 file_count = 9; // number of files in the upload (1 for PRDs)
  // Extracted plain text of a PRD asset (md/docx/pdf ingest), rendered by
  // clients as the asset detail preview. Filled by GetAsset only — ListAssets
  // leaves it empty to keep the list payload light; empty after GetAsset
  // means the text is unavailable (unreadable bytes) and a re-upload restores
  // the preview.
  string text_content = 10;
}

// One file of an UploadAsset request.
message AssetFile {
  string filename = 1; // base name only (e.g. "balance.proto"), no directories
  bytes content = 2;
}

message UploadAssetRequest {
  string project_id = 1;
  AssetType type = 2; // ASSET_TYPE_PRD or ASSET_TYPE_PROTO
  // PRD: exactly one file. PROTO: one or more files (the bundle, imports
  // resolved among them).
  repeated AssetFile files = 3;
  // Proto bundles only: the entry file's filename. Optional — when omitted the
  // server infers it as the file no other uploaded file imports; an ambiguous
  // bundle fails with INVALID_ARGUMENT unless this field names the entry.
  string entry_filename = 4;
}

message GetAssetRequest {
  string asset_id = 1;
}

message DeleteAssetRequest {
  string asset_id = 1;
}

message ListAssetsRequest {
  string project_id = 1;
  AssetType type = 2; // UNSPECIFIED = all types
}

message ListAssetsResponse {
  repeated Asset assets = 1;
}

// ---------------------------------------------------------------------------
// Requests / responses
// ---------------------------------------------------------------------------

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateProjectRequest {
  string name = 1;
  string repo_url = 2; // optional metadata
}

message ListEnvsRequest {
  string project_id = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

// Replaces the mutable project fields. Fails with ALREADY_EXISTS when another
// project already uses the name.
message UpdateProjectRequest {
  string project_id = 1;
  string name = 2;
  string repo_url = 3;
}

message ListEnvsResponse {
  repeated Env envs = 1;
}

// Create (when env.id is empty) or update an env.
message UpsertEnvRequest {
  Env env = 1;
}

message DeleteEnvRequest {
  string env_id = 1;
}

// PRD upload + analyze trigger. The whole file is sent in one field (spike
// files are small). Response streams analyze-agent progress and ends with the
// created draft cases.
message ParsePRDRequest {
  string project_id = 1;
  string filename = 2;
  PrdFormat format = 3;
  bytes content = 4;
}

message Progress {
  int32 pct = 1;
  string message = 2;
}

message DraftsCreated {
  repeated string case_ids = 1;
  repeated Case cases = 2;
}

message PrdRegistered {
  Prd prd = 1;
}

message ParseEvent {
  oneof payload {
    PrdRegistered prd_registered = 1;
    AgentText thinking = 2;
    Progress progress = 3;
    DraftsCreated drafts_created = 4;
    ErrorInfo error = 5;
  }
}

message ListCasesRequest {
  string project_id = 1;
  CaseStatus status = 2; // UNSPECIFIED = all statuses
}

message ListCasesResponse {
  repeated Case cases = 1;
}

message GetCaseRequest {
  string case_id = 1;
}

message ReviewCaseRequest {
  string case_id = 1;
  ReviewAction action = 2;
  string comment = 3;
}

// Creates a manual case (creator = human, no PRD traceability). The case
// starts in PENDING so it goes through the same review flow as agent-drafted
// cases. id / timestamps / version / changelog are assigned by the server.
message CreateCaseRequest {
  string project_id = 1;
  string title = 2;   // required, non-empty
  string goal = 3;    // required, non-empty
  repeated Alignment alignments = 4;
}

// Replaces the title, goal and alignments of a case. Only unapproved cases
// (DRAFT / PENDING / DISABLED) can be edited; editing an APPROVED case fails
// with FAILED_PRECONDITION (disable it first, then edit and re-approve).
// Bumps the version and appends a changelog entry; other fields (creator,
// source_prd_ref, status) are preserved.
message UpdateCaseRequest {
  string case_id = 1;
  string title = 2;   // required, non-empty
  string goal = 3;    // required, non-empty
  repeated Alignment alignments = 4;
}

message DeleteCaseRequest {
  string case_id = 1;
}

message RunCaseRequest {
  string project_id = 1;
  string env_id = 2;
  string case_id = 3;
  RunTrigger trigger = 4;
}

message ListRunsRequest {
  string project_id = 1;
  string env_id = 2;    // optional filter, empty = all envs
  string case_id = 3;   // optional filter
  RunStatus status = 4; // optional filter, UNSPECIFIED = all
  string from = 5;      // optional ISO-8601 lower bound on started_at
  string to = 6;        // optional ISO-8601 upper bound on started_at
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  string run_id = 1;
}

// Full run payload for the replay view.
message RunDetail {
  Run run = 1;
  repeated Event events = 2;
  repeated Artifact artifacts = 3;
}

message DownloadArtifactRequest {
  string artifact_id = 1;
}

// Chunk of binary artifact data.
message BytesChunk {
  bytes data = 1;
}

// ---------------------------------------------------------------------------
// Settings & chat
// ---------------------------------------------------------------------------

// Application-level settings. The provider configuration travels as an opaque
// JSON document (opencode-style provider descriptors: baseUrl / apiKey /
// models with a multimodal flag); the server validates the shape and that the
// default model is multimodal-capable.
message AppSettings {
  string provider_config_json = 1;
  string default_model = 2; // must reference a multimodal model in the config
  // Warm chromium browser pool size (T23): 0 disables the pool (launch per
  // run), the server caps the value at 4; default 1. Each pooled instance is
  // ~0.6-1 GB RSS; every run still gets its own fresh BrowserContext.
  uint32 browser_pool_size = 3;
}

message ChatRequest {
  string message = 1; // free-text user question
  string session_id = 2; // chat session the turn belongs to
}

// Role of a persisted chat message.
enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_USER = 1;
  CHAT_ROLE_ASSISTANT = 2;
}

// One stored chat conversation.
message ChatSession {
  string id = 1;
  string title = 2; // derived from the first user message
  string created_at = 3;
  string updated_at = 4;
}

// One stored chat turn (user question or assistant answer).
message ChatMessage {
  string id = 1;
  string session_id = 2;
  ChatRole role = 3;
  string content = 4;
  string model = 5; // resolved model id (assistant only, else empty)
  uint64 input_tokens = 6; // 0 when the provider reported no usage
  uint64 output_tokens = 7;
  double cost_total = 8; // USD; 0 when the provider reports no pricing
  string created_at = 9;
}

message CreateChatSessionRequest {
  string title = 1; // optional; server derives one from the first user message when empty
}

message ListChatSessionsResponse {
  repeated ChatSession sessions = 1; // newest activity first
}

message DeleteChatSessionRequest {
  string session_id = 1;
}

message ListChatMessagesRequest {
  string session_id = 1;
}

message ListChatMessagesResponse {
  repeated ChatMessage messages = 1; // oldest first, capped at the most recent 200
}

// Emitted once when the chat stream starts: resolved model id plus a rough
// client-visible estimate of the upward prompt size (snapshot + question).
message ChatStatus {
  string model = 1;
  uint64 prompt_tokens_est = 2;
}

// Emitted once when the chat stream finishes successfully: exact token usage
// as reported by the provider runtime (pi-ai done event).
message ChatUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  double cost_total = 3; // USD; 0 when the provider reports no pricing
}

// Streamed chat answer: text deltas, a terminal error, and the start/finish
// bookkeeping events (status/usage) that let clients show live metrics.
message ChatResponse {
  oneof kind {
    string text_delta = 1;
    string error = 2;
    ChatStatus status = 3;
    ChatUsage usage = 4;
  }
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

// Local empty message. Deliberately not google.protobuf.Empty: proto-loader's
// reflection pipeline strips cross-file dependencies, which breaks grpcurl
// against services importing well-known types. A local message keeps the
// contract self-contained.
message Empty {}


service Hpath {
  rpc ListProjects(Empty) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (Project);
  // Replaces the project's name and repo_url; fails with ALREADY_EXISTS when
  // the name is taken by another project.
  rpc UpdateProject(UpdateProjectRequest) returns (Project);
  // Deletes the project and everything under it (envs, cases with their
  // alignments/changelog, runs with their events + artifact records, PRDs) in
  // one transaction; artifact bytes are purged from the artifact store
  // best-effort after the commit.
  rpc DeleteProject(DeleteProjectRequest) returns (Empty);
  rpc ListEnvs(ListEnvsRequest) returns (ListEnvsResponse);
  rpc UpsertEnv(UpsertEnvRequest) returns (Env);
  // Fails with ALREADY_EXISTS when runs reference the env.
  rpc DeleteEnv(DeleteEnvRequest) returns (Empty);

  // Upload a PRD and run the analyze agent. Streams progress; the created
  // pending drafts become visible via ListCases.
  rpc ParsePRD(ParsePRDRequest) returns (stream ParseEvent);

  // Upload a project asset (T22 asset library). PRD uploads ride ParsePRD
  // (INVALID_ARGUMENT here); PROTO uploads are parsed server-side into the
  // project's API surface (Asset.api_doc) that its agents read globally and
  // that hard-validates grpc_call. Parse failures fail with INVALID_ARGUMENT
  // carrying the offending file and line. Unknown project: NOT_FOUND.
  rpc UploadAsset(UploadAssetRequest) returns (Asset);
  // Assets of a project, oldest first; UNSPECIFIED type lists all.
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  // One asset including its parsed api_doc (empty for PRDs). Unknown id:
  // NOT_FOUND.
  rpc GetAsset(GetAssetRequest) returns (Asset);
  // Deletes an asset and best-effort purges its stored bytes (no refcount:
  // cases reference PRDs by traceability string only).
  rpc DeleteAsset(DeleteAssetRequest) returns (Empty);

  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  rpc GetCase(GetCaseRequest) returns (Case);
  // Applies a review transition; invalid transitions fail with
  // FAILED_PRECONDITION.
  rpc ReviewCase(ReviewCaseRequest) returns (Case);

  // Creates a manual case (creator = human) in PENDING review status; the
  // server assigns id / timestamps / version / changelog. Requires project_id,
  // non-empty title and goal (INVALID_ARGUMENT otherwise); unknown project
  // fails with NOT_FOUND.
  rpc CreateCase(CreateCaseRequest) returns (Case);
  // Replaces title/goal/alignments of an unapproved case (DRAFT / PENDING /
  // DISABLED); editing an APPROVED case fails with FAILED_PRECONDITION.
  // Unknown cases fail with NOT_FOUND.
  rpc UpdateCase(UpdateCaseRequest) returns (Case);
  // Deletes a case together with its alignments and changelog. Fails with
  // FAILED_PRECONDITION when runs reference the case (run history must keep
  // pointing at a valid case definition).
  rpc DeleteCase(DeleteCaseRequest) returns (Empty);

  // Execute an approved case against an env. Streams run events in order.
  // Requires CASE_STATUS_APPROVED, else FAILED_PRECONDITION.
  rpc RunCase(RunCaseRequest) returns (stream Event);

  // Runtime control of an in-flight run (see the RunStatus state machine).
  // The run keeps executing server-side even if the RunCase client that
  // started it disconnects, so control RPCs target the run id directly.
  rpc PauseRun(RunControlRequest) returns (Run);
  rpc ResumeRun(RunControlRequest) returns (Run);
  rpc CancelRun(RunControlRequest) returns (Run);

  // Live browser screencast for an in-flight run (T21). Frames are ephemeral
  // (never persisted); the stream ends when the run settles. Unknown run ids
  // fail with NOT_FOUND; a run without an active frame hub (settled, or
  // executed by a server without execution deps) ends the stream immediately.
  // Subscribing mid-run is supported; multiple observers are allowed.
  rpc WatchRun(WatchRunRequest) returns (stream RunFrame);

  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (RunDetail);
  // Streams artifact bytes in chunks (mock serves synthetic bytes; real impl
  // proxies SeaweedFS).
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream BytesChunk);

  // Model provider settings (JSON document + default multimodal model).
  // UpdateSettings validates the JSON shape and rejects non-multimodal
  // defaults with INVALID_ARGUMENT.
  rpc GetSettings(Empty) returns (AppSettings);
  rpc UpdateSettings(AppSettings) returns (AppSettings);

  // Free-text status chat answered by the configured LLM (system prompt +
  // system data snapshot). Streams text deltas; errors surface on the error
  // branch of ChatResponse. Turns are persisted into the session named by
  // ChatRequest.session_id, and the most recent session history joins the
  // prompt so follow-up questions work.
  rpc Chat(ChatRequest) returns (stream ChatResponse);

  // Chat session bookkeeping. Sessions are created lazily by clients (empty
  // title allowed; the server derives one from the first user message).
  // DeleteChatSession removes the session and cascades to its messages.
  rpc CreateChatSession(CreateChatSessionRequest) returns (ChatSession);
  rpc ListChatSessions(Empty) returns (ListChatSessionsResponse);
  rpc DeleteChatSession(DeleteChatSessionRequest) returns (Empty);
  rpc ListChatMessages(ListChatMessagesRequest) returns (ListChatMessagesResponse);
}
